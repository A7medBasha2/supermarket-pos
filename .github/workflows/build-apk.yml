name: Build Android APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # مجلد android مش متسجل في الريبو: بنولّده وقت البناء ونحتفظ بكودنا زي ما هو
      - name: Generate Android scaffold
        run: |
          flutter create --platforms=android --project-name supermarket_pos --org com.supermarketpos /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

      - name: Patch AndroidManifest (permissions + app name)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>#' "$f"
          sed -i 's#android:label="supermarket_pos"#android:label="Supermarket POS"#' "$f"
          grep -q "android.permission.INTERNET" "$f" || { echo "Manifest patch failed"; cat "$f"; exit 1; }

      # ---------- توقيع ثابت (مفتاح واحد) ----------
      # لو الـ secrets الأربعة موجودة: كل البنايات (والتطبيقين) بتتوقّع بنفس المفتاح،
      # فأندرويد يقبل التحديث فوق النسخة القديمة. لو ناقصة: بيرجع للتوقيع المؤقت مع تحذير.
      - name: Configure release signing (fixed key)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::warning::Signing secrets are missing. APKs are signed with a TEMPORARY key and cannot update an installed app. See README."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > android/app/release.jks
          {
            echo "storePassword=$KS_PASS"
            echo "keyPassword=${KEY_PASS:-$KS_PASS}"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release.jks"
          } > android/key.properties
          python3 - <<'PY'
          import pathlib, re
          kts = pathlib.Path("android/app/build.gradle.kts")
          groovy = pathlib.Path("android/app/build.gradle")
          if kts.exists():
              p = kts
              block = (
                  '    signingConfigs {\n'
                  '        create("release") {\n'
                  '            val props = java.util.Properties()\n'
                  '            props.load(java.io.FileInputStream(rootProject.file("key.properties")))\n'
                  '            keyAlias = props["keyAlias"] as String\n'
                  '            keyPassword = props["keyPassword"] as String\n'
                  '            storeFile = file(props["storeFile"] as String)\n'
                  '            storePassword = props["storePassword"] as String\n'
                  '        }\n'
                  '    }\n\n'
              )
              pattern = r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)'
              repl = 'signingConfig = signingConfigs.getByName("release")'
          else:
              p = groovy
              block = (
                  '    signingConfigs {\n'
                  '        release {\n'
                  '            def props = new Properties()\n'
                  '            props.load(new FileInputStream(rootProject.file("key.properties")))\n'
                  '            keyAlias props["keyAlias"]\n'
                  '            keyPassword props["keyPassword"]\n'
                  '            storeFile file(props["storeFile"])\n'
                  '            storePassword props["storePassword"]\n'
                  '        }\n'
                  '    }\n\n'
              )
              pattern = r'signingConfig\s+signingConfigs\.debug'
              repl = 'signingConfig signingConfigs.release'
          t = p.read_text()
          assert "    buildTypes {" in t, "buildTypes block not found"
          t = t.replace("    buildTypes {", block + "    buildTypes {", 1)
          t, n = re.subn(pattern, repl, t)
          assert n == 1, "debug signingConfig line not found"
          p.write_text(t)
          print("release signing configured in", p)
          PY

      - run: flutter pub get

      # تحليل الكود: مش بيوقف البناء، بس بيظهر الأخطاء في اللوج لو فيه
      - name: Analyze
        run: flutter analyze || true

      # ---------- 1) تطبيق صاحب المحل ----------
      - name: Build owner app (APK)
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --target lib/main.dart
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Save owner APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/owner-app.apk

      # ---------- 2) تطبيق العملاء (اسم وحزمة مختلفين عشان يتثبتوا مع بعض) ----------
      - name: Rename package for customer app
        run: |
          gradle=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -1)
          echo "Using $gradle"
          sed -i -E 's/applicationId\s*=?\s*"[^"]+"/applicationId = "com.supermarketpos.customer"/' "$gradle"
          grep -n "applicationId" "$gradle"
          sed -i 's#android:label="Supermarket POS"#android:label="Supermarket Shop"#' android/app/src/main/AndroidManifest.xml

      - name: Build customer app (APK)
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --target lib/customer/customer_main.dart
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Save customer APK
        run: cp build/app/outputs/flutter-apk/app-release.apk dist/customer-app.apk

      # بصمة شهادة التوقيع: لازم تبقى نفسها في كل بناء عشان التحديث فوق النسخة القديمة يشتغل
      - name: Print APK signing certificate
        run: |
          AS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$AS" ]; then echo "apksigner not found"; exit 0; fi
          for f in dist/*.apk; do
            echo "== $f"
            "$AS" verify --print-certs "$f" | grep -E "Signer #1 certificate (DN|SHA-256)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: supermarket-apks
          path: dist/*.apk
